<!doctype html>
<html lang="en" class="h-full">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <base href="../" />
  <title>Pre-Budget Meeting - UBIS Enterprise</title>
  <script src="assets/vendor/tailwind.3.4.17.js"></script>
  <script>tailwind.config = {darkMode: 'class', theme: {extend: {colors: {navy: '#063f66', teal: '#06aeb8', ambergov: '#f59e0b'}, boxShadow: {soft: '0 14px 35px rgba(6,63,102,.10)'}, animation: {'fade-in': 'fadeIn .35s ease both', 'slide-up': 'slideUp .45s ease both', 'scale-in': 'scaleIn .25s ease both', 'shake': 'shake .28s ease both'}}}}</script>
  <script src="assets/vendor/lucide.min.js" defer></script>
  <link rel="stylesheet" href="assets/styles.css" />
  <script src="assets/includes/sidebar.js"></script>
  <script src="assets/includes/header.js"></script>
  <script src="assets/includes/center.js"></script>
  <script src="assets/includes/footer.js"></script>
  <script src="assets/includes/shell.js"></script>
</head>

<body class="min-h-full bg-[#f7fbff] text-slate-800 antialiased dark:bg-slate-950 dark:text-slate-100" data-shell="app"
  data-page-title="Pre-Budget Meeting" data-breadcrumb="Renumber PSE Code">
  <div id="drawerOverlay" class="fixed inset-0 z-30 hidden bg-slate-950/40 lg:hidden"></div>
  <div data-include="sidebar"></div>
  <div id="appFrame" class="min-h-screen transition-all duration-300 lg:pl-72">
    <div data-include="header"></div>
    <main id="main" class="px-4 py-6 sm:px-6 lg:px-8">
      <div data-include="center"></div>
      <section class="panel overflow-hidden p-0 animate-fade-in">
        <div class="heading text-center heading-bg justify-between items-center border rounded px-4 py-3 text-white">
          Renumber PSE Code</div>
        <!-------------------------Form Fields Starts--------------------------->
        <div class="flex flex-col gap-4 border-b border-slate-200 p-5 dark:border-slate-800 text-sm">
          <div class="grid w-full grid-cols-1 gap-4 lg:grid-cols-1">
            <label class="table-toolbar-field field" style="animation-delay:70ms">
              <span>Demand<b>*</b></span>
              <select class="input truncate " aria-label="Select">
                <option value="">Select</option>
                <option value="" selected="selected">1-Deparment of Agriculture and Farmers Welfare</option>
              </select>
            </label>   
          </div>
        </div>
        <!-------------------------Form Fields Ends--------------------------->
        <div class="p-2">
          <div class="grid w-full grid-cols-1 gap-4 lg:grid-cols-2 ml-2">
            <span id="sequenceStatus" class="text-left text-sm font-bold text-sky-900" role="status"
              aria-live="polite"></span>
            <span id="sequencingHelp" class="text-right mb-3 px-2 text-sm text-slate-600 dark:text-slate-300">Drag a row
              to change its sequence. Keyboard: focus a row, then use Alt + Up/Down.</span>
          </div>
          <table class="overflow-x-auto  demo-table min-w-full" aria-describedby="sequencingHelp">
            <thead>
              <tr>
                <th width="5%">Move</th>
                <th width="15%">Current PSE Code</th>
                <th>PSE Category Name</th>                
                <th>PSE Name</th>                
              </tr>
            </thead>
            <!-- Add rows here as: <tr><td>20</td><td>Your scheme name</td></tr>. Rows are made draggable automatically. -->
            <tbody id="schemeRows">
              <tr>
                <td>New PSE 1</td>
                <td>New PSE 1</td>                
                <td>PSE Name 1</td>                
              </tr>
              <tr>
                <td>New PSE 2</td>
                <td>New PSE 2</td>                
                <td>PSE Name 2</td>                
              </tr>
             
            </tbody>
          </table>
          <div class="mt-4 flex justify-center gap-3">
            <button id="saveSequence" type="button" class="btn-primary">Update</button>
            <button id="resetSequence" type="button" class="btn-secondary">Reset</button>
          </div>
        </div>
      </section>
  </div>
  </div>
  </main>
  <div data-include="footer"></div>
  </div>
  <!-- <div id="toastRegion" class="fixed right-4 top-20 z-50 space-y-3"></div> -->
  <script src="assets/app.js"></script>
  <script src="assets/appendix-renderers.js"></script>
  <script src="assets/appendix-actions.js"></script>
  <script src="assets/dropdown.js"></script>
</body>

</html>
