<!doctype html>
<html lang="en" class="h-full">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <base href="../" />
  <title>Pre-Budget Meeting - UBIS Enterprise</title>
  <script src="assets/vendor/tailwind.3.4.17.js"></script>
  <script>tailwind.config = { darkMode: 'class', theme: { extend: { colors: { navy: '#063f66', teal: '#06aeb8', ambergov: '#f59e0b' }, boxShadow: { soft: '0 14px 35px rgba(6,63,102,.10)' }, animation: { 'fade-in': 'fadeIn .35s ease both', 'slide-up': 'slideUp .45s ease both', 'scale-in': 'scaleIn .25s ease both', 'shake': 'shake .28s ease both' } } } }</script>
  <script src="assets/vendor/lucide.min.js" defer></script>
  <link rel="stylesheet" href="assets/styles.css" />
  <script src="assets/includes/sidebar.js"></script>
  <script src="assets/includes/header.js"></script>
  <script src="assets/includes/center.js"></script>
  <script src="assets/includes/footer.js"></script>
  <script src="assets/includes/shell.js"></script>
</head>

<body class="min-h-full bg-[#f7fbff] text-slate-800 antialiased dark:bg-slate-950 dark:text-slate-100" data-shell="app"
  data-page-title="Pre-Budget Meeting" data-breadcrumb="List of Circulars">
  <div id="drawerOverlay" class="fixed inset-0 z-30 hidden bg-slate-950/40 lg:hidden"></div>
  <div data-include="sidebar"></div>
  <div id="appFrame" class="min-h-screen transition-all duration-300 lg:pl-72">
    <div data-include="header"></div>
    <main id="main" class="px-4 py-6 sm:px-6 lg:px-8">
      <div data-include="center"></div>
      <div id="allocation" class="xl:col-span-2 mt-2">
        <section class="panel overflow-hidden p-0">
          <div class="heading text-center heading-bg justify-between items-center border rounded px-4 py-3 text-white">
            List of Circulars</div>

          <div class="overflow-x-auto p-2">
            <div class="overflow-x-auto">
              <!---Tab start here -->
              <div class="W-full mx-auto">
                <div class="flex border-b border-gray-300 bg-white rounded-t-lg overflow-hidden shadow-sm">
                  <div class="inline-block">
                    <input type="radio" name="custom-tabs" id="tab-1-trigger" class="peer hidden" checked />
                    <label for="tab-1-trigger"
                      class="block px-4 py-2.5 text-xs md:text-sm border-r border-gray-300 bg-gray-100 text-gray-600 border-t-2 border hover:bg-gray-200 transition-all duration-150 cursor-pointer select-none
              peer-checked:bg-cyan-50 peer-checked:border-cyan-500 peer-checked:font-semibold peer-checked:text-cyan-950">
                      View Circulars not having templates
                    </label>
                  </div>

                  <div class="inline-block">
                    <input type="radio" name="custom-tabs" id="tab-2-trigger" class="peer hidden" />
                    <label for="tab-2-trigger"
                      class="block px-4 py-2.5 text-xs md:text-sm border-r border-gray-300 bg-gray-100 text-gray-600 border-t-2 border hover:bg-gray-200 transition-all duration-150 cursor-pointer select-none
              peer-checked:bg-cyan-50 peer-checked:border-cyan-500 peer-checked:font-semibold peer-checked:text-cyan-950">
                      View Circulars having templates
                    </label>
                  </div>
                </div>

                <div class="bg-white p-3 border border-t-0 border-gray-300 rounded-b-lg shadow-sm min-h-[400px]">
                  <input type="radio" name="content-tabs" id="body-tab1" class="peer/b1 hidden" checked />
                  <input type="radio" name="content-tabs" id="body-tab2" class="peer/b2 hidden" />

                  <!--------------- Start Tab 1 Data  ---------------->
                  <div class="hidden peer-checked/b1:block">
                    <!---------------------------Data Area --------------------------->
                    <form>
                      <div
                        class="flex flex-col md:flex-row md:items-center gap-4 bg-gray-50 p-4 border border-gray-200 rounded-lg mb-6">
                        <label class="font-bold text-gray-700 whitespace-nowrap text-sm md:text-base">
                          No Record Found
                        </label>
                      </div>
                    </form>
                  </div>
                     <!--------------- End Tab 1 Data  ---------------->

                     <!--------------- Start Tab 2 Data  ---------------->
                  <div class="hidden peer-checked/b2:block">
                    <!-- Content -->
                    <div class="p-2">
                      <!-- Legend -->
                      <div class="flex flex-col md:flex-row md:justify-between md:items-center gap-5 mb-4">

                        <h3 class="text-lg font-semibold text-gray-700">
                          Response Timeline
                        </h3>
                        <div class="flex flex-wrap gap-6 text-sm">
                          <div class="flex items-center gap-2">
                            <span class="w-4 h-4 rounded-full status-red"></span>
                            Last Date Exceeded
                          </div>

                          <div class="flex items-center gap-2">
                            <span class="w-4 h-4 rounded-full status-yellow"></span>
                            Less than 7 Days Left
                          </div>
                          <div class="flex items-center gap-2">
                            <span class="w-4 h-4 rounded-full status-blue"></span>
                            More than 7 Days Left
                          </div>
                        </div>
                      </div>
                      <!-- Filter Card -->

                      <div class="rounded-xl border bg-slate-50 p-6">
                        <!-- Status -->

                        <div class="flex gap-10 mb-6">
                          <label class="flex items-center gap-2 cursor-pointer">
                            <input type="radio" checked class="text-green-600">
                            <span>With Para No.</span>
                          </label>

                          <label class="flex items-center gap-2 cursor-pointer">
                            <input type="radio" class="text-green-600">
                            <span>Without Para No.</span>
                          </label>
                        </div>

                        <!-- Filters -->

                        <div class="grid lg:grid-cols-4 md:grid-cols-2 gap-6">

                          <div>

                            <label class="block text-sm font-medium mb-2 text-gray-600">
                              Circular
                            </label>

                            <select class="w-full rounded-lg border px-2 py-2 focus:ring-2 focus:ring-green-500">

                              <option>All Circulars</option>

                            </select>

                          </div>

                          <div>

                            <label class="block text-sm font-medium mb-2 text-gray-600">
                              From Date
                            </label>
                            <input type="date"
                              class="w-full rounded-lg border px-2 py-1 focus:ring-2 focus:ring-green-500">
                          </div>

                          <div>
                            <label class="block text-sm font-medium mb-2 text-gray-600">
                              To Date
                            </label>
                            <input type="date"
                              class="w-full rounded-lg border px-2 py-1 focus:ring-2 focus:ring-green-500">
                          </div>
                        </div>
                      </div>
                      <!-- Empty State -->
                    </div>
                    <div class="mt-4 flex justify-center gap-3">
                      <button class="btn-primary">Filter</button>
                    </div>
                  </div>
                     <!--------------- End Tab 1 Data  ---------------->
                </div>

                </label>
              </div>
            </div>
        </section>
      </div>
    </main>
    <div data-include="footer"></div>
  </div>
  <!-- <div id="toastRegion" class="fixed right-4 top-20 z-50 space-y-3"></div> -->
  <script src="assets/app.js"></script>
  <script src="assets/appendix-renderers.js"></script>
  <script src="assets/appendix-actions.js"></script>
  <script src="assets/dropdown.js"></script>

</body>

</html>
